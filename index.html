<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo Babylon 開放創作素材包</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141a26; --panel2:#1a2233; --line:#26314a;
    --txt:#e8edf5; --muted:#8b96ad; --accent:#5eead4; --accent2:#7dd3fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
  header{padding:36px 24px 20px;text-align:center;border-bottom:1px solid var(--line);
    background:radial-gradient(600px 200px at 50% -60px, rgba(94,234,212,.12), transparent)}
  header h1{font-size:28px;letter-spacing:2px}
  header h1 span{color:var(--accent)}
  header p{color:var(--muted);margin-top:8px;font-size:14px}
  .toolbar{max-width:1100px;margin:0 auto;padding:20px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:220px;display:flex}
  .search input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px 0 0 8px;
    color:var(--txt);padding:10px 14px;font-size:15px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search button{background:var(--accent);border:none;border-radius:0 8px 8px 0;padding:0 18px;
    font-size:15px;cursor:pointer;color:#06251f;font-weight:bold}
  .tabs{display:flex;gap:8px}
  .tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:10px 20px;border-radius:8px;cursor:pointer;font-size:15px}
  .tabs button.active{background:var(--panel2);color:var(--accent);border-color:var(--accent)}
  .count{max-width:1100px;margin:0 auto;padding:0 24px;color:var(--muted);font-size:13px}
  .grid{max-width:1100px;margin:0 auto;padding:16px 24px 60px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;transition:border-color .2s}
  .card:hover{border-color:var(--accent)}
  .thumb{position:relative;aspect-ratio:4/3;background:#000;cursor:zoom-in;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .more{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;
    font-size:12px;padding:3px 9px;border-radius:20px}
  .badge{position:absolute;left:8px;top:8px;font-size:12px;padding:3px 10px;border-radius:20px;
    background:rgba(94,234,212,.15);color:var(--accent);border:1px solid rgba(94,234,212,.4)}
  .badge.scene{background:rgba(125,211,252,.15);color:var(--accent2);border-color:rgba(125,211,252,.4)}
  .info{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .info h3{font-size:17px}
  .info .names{font-size:13px;color:var(--muted)}
  .info .src{font-size:12px;color:var(--accent2)}
  .info .desc{font-size:13px;color:var(--muted);line-height:1.6;flex:1}
  .actions{display:flex;gap:8px;padding:0 16px 14px}
  .actions button,.actions a{flex:1;text-align:center;font-size:13px;padding:8px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel2);color:var(--txt);text-decoration:none}
  .actions button:hover,.actions a:hover{border-color:var(--accent);color:var(--accent)}
  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;
    justify-content:center;z-index:50;flex-direction:column;padding:20px}
  .lb.open{display:flex}
  .lb img{max-width:92vw;max-height:78vh;object-fit:contain;border-radius:8px}
  .lb .cap{color:var(--muted);font-size:13px;margin-top:10px;text-align:center}
  .lb .row{display:flex;gap:10px;margin-top:14px;align-items:center}
  .lb button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px}
  .lb button:hover{border-color:var(--accent);color:var(--accent)}
  .lb .close{position:absolute;top:16px;right:20px;font-size:28px;background:none;border:none;color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px;border-top:1px solid var(--line)}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>NEO BABYLON <span>開放創作素材包</span></h1>
  <p>Open Creation Media Kit — 官方已公開人物與場景視覺參考</p>
</header>
<div class="toolbar">
  <div class="search">
    <input id="q" type="text" placeholder="搜尋中文名 / 英文名 / 日文名 / 描述…">
    <button onclick="doSearch()">搜尋</button>
  </div>
  <div class="tabs">
    <button data-t="all" class="active" onclick="setTab('all')">全部</button>
    <button data-t="char" onclick="setTab('char')">角色</button>
    <button data-t="scene" onclick="setTab('scene')">場景</button>
  </div>
</div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<div class="lb" id="lb" onclick="if(event.target===this)closeLb()">
  <button class="close" onclick="closeLb()">×</button>
  <img id="lbimg" src="" alt="">
  <div class="cap" id="lbcap"></div>
  <div class="row">
    <button onclick="lbNav(-1)">← 上一張</button>
    <a id="lbdl" href="" download><button>下載此圖</button></a>
    <button onclick="lbNav(1)">下一張 →</button>
  </div>
</div>

<footer>
  素材僅供《新巴比倫》開放創作計畫非商業創作使用 · <a href="https://neobabylon.icareu.tw/open-creation/" target="_blank">使用規範</a>
</footer>

<script>
let DB = {char:[], scene:[]};
let tab = 'all', kw = '';
let lbList = [], lbIdx = 0;

fetch('data/characters.json').then(r=>r.json()).then(d=>{DB.char=d.map(x=>({...x,_t:'char'}));render();});
fetch('data/scenes.json').then(r=>r.json()).then(d=>{DB.scene=d.map(x=>({...x,_t:'scene'}));render();});

function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));render();}
function doSearch(){kw=document.getElementById('q').value.trim().toLowerCase();render();}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
document.getElementById('q').addEventListener('input',e=>{kw=e.target.value.trim().toLowerCase();render();});

function match(x){
  if(!kw) return true;
  return (x.name_zh+' '+x.name_en+' '+x.name_jp+' '+x.desc+' '+x.source).toLowerCase().includes(kw);
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  const grid=document.getElementById('grid');
  let items=[...DB.char,...DB.scene];
  if(tab==='char') items=DB.char;
  if(tab==='scene') items=DB.scene;
  items=items.filter(match);
  document.getElementById('count').textContent=`共 ${items.length} 筆（角色 ${DB.char.filter(match).length} · 場景 ${DB.scene.filter(match).length}）`;
  grid.innerHTML=items.map((x,i)=>{
    const isC=x._t==='char';
    const sub=[x.name_en,x.name_jp].filter(Boolean).join(' · ');
    const thumbs=x.images.slice(0,1).map(p=>
      `<div class="thumb" onclick='openLb(${JSON.stringify(x.images)},0,${JSON.stringify(x.name_zh)})'>
         <span class="badge${isC?'':' scene'}">${isC?'角色':'場景'}</span>
         <img src="${p}" alt="${esc(x.name_zh)}" loading="lazy">
         ${x.images.length>1?`<span class="more">+${x.images.length-1}</span>`:''}
       </div>`).join('');
    const dlAll=x.images.map(p=>`<a href="${p}" download>下載全部 (${x.images.length})</a>`).join('');
    return `<div class="card">${thumbs}
      <div class="info"><h3>${esc(x.name_zh)}</h3>
        ${sub?`<div class="names">${esc(sub)}</div>`:''}
        <div class="src">${esc(x.source)} · ${esc(x.id)}</div>
        <div class="desc">${esc(x.desc)}</div></div>
      <div class="actions">
        <button onclick='openLb(${JSON.stringify(x.images)},0,${JSON.stringify(x.name_zh)})'>檢視圖片</button>
        ${dlAll}</div></div>`;
  }).join('') || '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px">沒有符合的結果</p>';
}

function openLb(images,idx,name){
  lbList=images; lbIdx=idx; showLb(name);
  document.getElementById('lb').classList.add('open');
}
function showLb(name){
  const p=lbList[lbIdx];
  document.getElementById('lbimg').src=p;
  document.getElementById('lbcap').textContent=`${name}（${lbIdx+1}/${lbList.length}）· ${p.split('/').pop()}`;
  document.getElementById('lbdl').href=p;
}
function lbNav(d){lbIdx=(lbIdx+d+lbList.length)%lbList.length;showLb(document.getElementById('lbcap').textContent.split('（')[0]);}
function closeLb(){document.getElementById('lb').classList.remove('open');}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').classList.contains('open'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')lbNav(-1);
  if(e.key==='ArrowRight')lbNav(1);
});
</script>
</body>
</html>
